name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  linux:
    runs-on: ubuntu-latest
    name: linux (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            container: ubuntu:latest
          - name: debian
            container: debian:latest
          - name: alpine
            container: alpine:latest
          - name: rhel
            container: registry.access.redhat.com/ubi9/ubi:latest
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 15
    defaults:
      run:
        shell: sh
    steps:
      - name: Install OS dependencies
        run: |
          set -eu
          CURL_PKG=""
          ICU_PKG=""
          if ! command -v curl >/dev/null 2>&1; then
            CURL_PKG="curl"
          fi
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            ICU_PKG="$(apt-cache pkgnames | awk '/^libicu[0-9]+$/{print}' | sort -V | tail -n 1)"
            if [ -z "${ICU_PKG}" ]; then
              ICU_PKG="libicu-dev"
            fi
            apt-get install -y --no-install-recommends \
              ca-certificates \
              ${CURL_PKG} \
              git \
              gzip \
              ${ICU_PKG} \
              python3 \
              python3-packaging \
              tar
            rm -rf /var/lib/apt/lists/*
          elif command -v apk >/dev/null 2>&1; then
            ICU_PKG="icu-libs"
            apk add --no-cache \
              ca-certificates \
              ${CURL_PKG} \
              git \
              gzip \
              ${ICU_PKG} \
              python3 \
              py3-packaging \
              tar
          elif command -v microdnf >/dev/null 2>&1; then
            if [ -n "${CURL_PKG}" ]; then
              CURL_PKG="curl-minimal"
            fi
            ICU_PKG="libicu"
            microdnf install -y \
              ca-certificates \
              ${CURL_PKG} \
              git \
              gzip \
              ${ICU_PKG} \
              python3 \
              python3-packaging \
              tar
            microdnf clean all
          elif command -v dnf >/dev/null 2>&1; then
            ICU_PKG="libicu"
            dnf install -y \
              ca-certificates \
              ${CURL_PKG} \
              git \
              gzip \
              ${ICU_PKG} \
              python3 \
              python3-packaging \
              tar
            dnf clean all
          else
            echo "ERROR: Unsupported package manager in container" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@main

      - name: Run dry-run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          chmod +x pwsh-upstall-linux.sh
          ./pwsh-upstall-linux.sh --dry-run

      - name: Install PowerShell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ./pwsh-upstall-linux.sh --force

      - name: Verify installation
        run: |
          set -eu
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "ERROR: pwsh command not found after installation" >&2
            exit 1
          fi
          echo "PowerShell installed successfully"
          pwsh -NoLogo -NoProfile -Command '
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion.ToString())"
            Write-Host "Edition: $($PSVersionTable.PSEdition)"
            Write-Host "OS: $($PSVersionTable.OS)"
          '

      - name: Uninstall PowerShell
        run: |
          set -eu
          ./pwsh-upstall-linux.sh --uninstall || echo "Uninstall completed with warnings"

      - name: Verify uninstallation
        run: |
          set -eu
          if command -v pwsh >/dev/null 2>&1; then
            echo "Note: pwsh still available (may be system-installed version)"
            pwsh -NoLogo -NoProfile -Command 'Write-Host "Remaining version: $($PSVersionTable.PSVersion)"'
          else
            echo "PowerShell uninstalled successfully"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: linux-logs-${{ matrix.name }}
          path: ~/.local/share/powershell/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Run dry-run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x pwsh-upstall-macos.sh
          ./pwsh-upstall-macos.sh --dry-run

      - name: Install PowerShell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo env GITHUB_TOKEN="${GITHUB_TOKEN}" ./pwsh-upstall-macos.sh --force

      - name: Verify installation
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "ERROR: pwsh command not found after installation" >&2
            exit 1
          fi
          echo "PowerShell installed successfully"
          pwsh -NoLogo -NoProfile -Command '
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion.ToString())"
            Write-Host "Edition: $($PSVersionTable.PSEdition)"
            Write-Host "OS: $($PSVersionTable.OS)"
          '

      - name: Uninstall PowerShell
        run: |
          set -euo pipefail
          sudo ./pwsh-upstall-macos.sh --uninstall || echo "Uninstall completed with warnings"

      - name: Verify uninstallation
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            echo "Note: pwsh still available (may be system-installed version)"
            pwsh -NoLogo -NoProfile -Command 'Write-Host "Remaining version: $($PSVersionTable.PSVersion)"'
          else
            echo "PowerShell uninstalled successfully"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: macos-logs
          path: ~/.local/share/powershell/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Capture pre-install state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Pre-install PowerShell state:"
          Get-Command pwsh -ErrorAction SilentlyContinue | Select-Object Name, Version, Source | Format-List
          $preInstallPath = (Get-Command pwsh -ErrorAction SilentlyContinue)
          if ($preInstallPath) {
            $env:PRE_INSTALL_PWSH_PATH = $preInstallPath.Source
          } else {
            $env:PRE_INSTALL_PWSH_PATH = ''
          }
          "PRE_INSTALL_PWSH_PATH=$env:PRE_INSTALL_PWSH_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run dry-run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          .\pwsh-upstall-windows.ps1 -WhatIf -Verbose

      - name: Install PowerShell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $installerDir = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pwsh-upstall-install-source'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          "PWSH_UPSTALL_INSTALL_SOURCE_DIR=$installerDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\pwsh-upstall-windows.ps1 -Force -OutDir $installerDir -Verbose

      - name: Verify installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            Write-Error "ERROR: pwsh command not found after installation"
            exit 1
          }
          Write-Host "PowerShell installed successfully"
          # Run pwsh to verify it works and show version
          & pwsh -NoLogo -NoProfile -Command '
            Write-Host "PowerShell Version: $($PSVersionTable.PSVersion.ToString())"
            Write-Host "Edition: $($PSVersionTable.PSEdition)"
            Write-Host "OS: $($PSVersionTable.OS)"
          '

      - name: Break PowerShell MSI cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class PwshUpstallMsi
          {
              [DllImport("msi.dll", CharSet = CharSet.Unicode)]
              public static extern int MsiGetProductInfo(string product, string property, StringBuilder valueBuf, ref int valueBufSize);
          }
          '@

          function Get-MsiProductInfoValue {
            param(
              [Parameter(Mandatory = $true)][string]$ProductCode,
              [Parameter(Mandatory = $true)][string]$Property
            )

            $capacity = 512
            while ($true) {
              $length = $capacity
              $buffer = New-Object System.Text.StringBuilder ($capacity + 1)
              $result = [PwshUpstallMsi]::MsiGetProductInfo($ProductCode, $Property, $buffer, [ref]$length)

              if ($result -eq 0) {
                return $buffer.ToString()
              }

              if ($result -eq 234) {
                $capacity = $length + 1
                continue
              }

              throw "MsiGetProductInfo failed for $ProductCode property $Property with error $result."
            }
          }

          function Get-PwshMsiProduct {
            $uninstallRoots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
            )

            foreach ($root in $uninstallRoots) {
              if (-not (Test-Path -LiteralPath $root)) {
                continue
              }

              foreach ($key in Get-ChildItem -LiteralPath $root) {
                $item = Get-ItemProperty -LiteralPath $key.PSPath
                $displayNameProperty = $item.PSObject.Properties['DisplayName']
                $windowsInstallerProperty = $item.PSObject.Properties['WindowsInstaller']
                $displayName = if ($displayNameProperty) { [string]$displayNameProperty.Value } else { '' }
                $windowsInstaller = if ($windowsInstallerProperty) { [int]$windowsInstallerProperty.Value } else { 0 }

                if ($windowsInstaller -eq 1 -and
                    $displayName -notmatch 'x86' -and
                    ($displayName -match '^PowerShell 7' -or ($displayName -match '^PowerShell\b' -and $displayName -match 'x64|arm64|7')) -and
                    $key.PSChildName -match '^\{[0-9A-Fa-f-]{36}\}$') {
                  return [PSCustomObject]@{
                    ProductCode = $key.PSChildName
                    DisplayName = $displayName
                  }
                }
              }
            }

            return $null
          }

          function Clear-PwshMsiSourceList {
            param([Parameter(Mandatory = $true)][string]$LocalPackage)

            $productsRoot = 'HKLM:\SOFTWARE\Classes\Installer\Products'
            if (-not (Test-Path -LiteralPath $productsRoot)) {
              return $null
            }

            foreach ($key in Get-ChildItem -LiteralPath $productsRoot) {
              $item = Get-ItemProperty -LiteralPath $key.PSPath
              $localPackageProperty = $item.PSObject.Properties['LocalPackage']
              if (-not $localPackageProperty -or [string]$localPackageProperty.Value -ine $LocalPackage) {
                continue
              }

              $sourceListPath = Join-Path -Path $key.PSPath -ChildPath 'SourceList'
              if (Test-Path -LiteralPath $sourceListPath) {
                foreach ($child in Get-ChildItem -LiteralPath $sourceListPath -ErrorAction SilentlyContinue) {
                  Remove-Item -LiteralPath $child.PSPath -Recurse -Force
                }

                foreach ($propertyName in @('LastUsedSource', 'PackageName')) {
                  Remove-ItemProperty -LiteralPath $sourceListPath -Name $propertyName -ErrorAction SilentlyContinue
                }
              }

              return $sourceListPath
            }

            return $null
          }

          $product = Get-PwshMsiProduct
          if (-not $product) {
            throw 'Could not find an MSI-installed PowerShell product to corrupt for the cache repair regression.'
          }

          $installSourceDir = $env:PWSH_UPSTALL_INSTALL_SOURCE_DIR
          if (-not $installSourceDir -or -not (Test-Path -LiteralPath $installSourceDir)) {
            throw "PowerShell install source directory was not found: $installSourceDir"
          }

          $repairSourceDir = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pwsh-upstall-repair-source'
          New-Item -ItemType Directory -Force -Path $repairSourceDir | Out-Null

          $installer = Get-ChildItem -LiteralPath $installSourceDir -Filter '*.msi' | Select-Object -First 1
          if (-not $installer) {
            throw "PowerShell installer was not found in install source directory: $installSourceDir"
          }

          Move-Item -LiteralPath $installer.FullName -Destination (Join-Path -Path $repairSourceDir -ChildPath $installer.Name) -Force
          Remove-Item -LiteralPath $installSourceDir -Recurse -Force
          "PWSH_UPSTALL_INSTALLER_DIR=$repairSourceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $localPackage = Get-MsiProductInfoValue -ProductCode $product.ProductCode -Property 'LocalPackage'
          if (-not $localPackage -or -not (Test-Path -LiteralPath $localPackage -PathType Leaf)) {
            throw "PowerShell MSI LocalPackage was not found: $localPackage"
          }

          $sourceListPath = Clear-PwshMsiSourceList -LocalPackage $localPackage

          $missingPackage = "$localPackage.missing"
          Remove-Item -LiteralPath $missingPackage -Force -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $localPackage -Destination $missingPackage -Force

          if (Test-Path -LiteralPath $localPackage) {
            throw "Failed to remove PowerShell MSI LocalPackage: $localPackage"
          }

          Write-Host "Moved $($product.DisplayName) cached MSI to trigger Windows Installer source error 1612:"
          Write-Host "  ProductCode: $($product.ProductCode)"
          Write-Host "  LocalPackage: $localPackage"
          Write-Host "  MovedTo: $missingPackage"
          Write-Host "  ClearedSourceList: $sourceListPath"
          Write-Host "  RepairSource: $repairSourceDir"

      - name: Uninstall PowerShell through MSI cache repair path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $stdoutLog = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pwsh-upstall-uninstall-stdout.log'
          $stderrLog = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pwsh-upstall-uninstall-stderr.log'
          Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue

          $scriptPath = Join-Path -Path $PWD -ChildPath 'pwsh-upstall-windows.ps1'
          $installerDir = if ($env:PWSH_UPSTALL_INSTALLER_DIR) {
            $env:PWSH_UPSTALL_INSTALLER_DIR
          } else {
            Join-Path -Path $env:RUNNER_TEMP -ChildPath 'pwsh-upstall-msi'
          }

          $process = Start-Process -FilePath powershell.exe -ArgumentList @(
            '-NoLogo',
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            $scriptPath,
            '-Uninstall',
            '-OutDir',
            $installerDir,
            '-Verbose'
          ) -Wait -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

          $outputParts = @()
          if (Test-Path -LiteralPath $stdoutLog) {
            $outputParts += Get-Content -LiteralPath $stdoutLog -Raw
          }
          if (Test-Path -LiteralPath $stderrLog) {
            $outputParts += Get-Content -LiteralPath $stderrLog -Raw
          }
          $output = $outputParts -join [Environment]::NewLine
          Write-Host $output

          if ($process.ExitCode -ne 0) {
            throw "PowerShell uninstall failed with exit code $($process.ExitCode)."
          }

          if ($output -notmatch 'Windows Installer cache for PowerShell .+ is missing \(error 1612\)') {
            throw 'The uninstall path did not detect the missing Windows Installer source condition.'
          }

          if ($output -notmatch 'Installer cache rebuilt; retrying PowerShell uninstall') {
            throw 'The uninstall path did not rebuild the Windows Installer cache before retrying.'
          }

      - name: Verify uninstallation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $postUninstallCmd = Get-Command pwsh -ErrorAction SilentlyContinue
          $postUninstallPath = if ($postUninstallCmd) { $postUninstallCmd.Source } else { $null }

          # If pwsh still exists, verify it's the same pre-existing installation
          if ($postUninstallPath) {
            Write-Host "pwsh found at: $postUninstallPath"
            if ($env:PRE_INSTALL_PWSH_PATH) {
              if ($postUninstallPath -eq $env:PRE_INSTALL_PWSH_PATH) {
                Write-Host "OK: Only pre-existing PowerShell remains (system installation)"
              } else {
                Write-Host "Note: Different pwsh version found after uninstall"
                Write-Host "  Pre-install: $env:PRE_INSTALL_PWSH_PATH"
                Write-Host "  Current: $postUninstallPath"
              }
            } else {
              Write-Host "Note: pwsh present after uninstall (may be system-installed version)"
            }
          } else {
            Write-Host "PowerShell uninstalled successfully (pwsh command not found)"
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: windows-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
